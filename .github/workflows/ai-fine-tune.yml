name: Comenta AI — Daily Training & Fine-Tuning

on:
  schedule:
    - cron: '0 3 * * *' # Executa diariamente às 03:00 AM UTC
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provedor de IA Alvo'
        required: true
        default: 'google'

jobs:
  fine-tune:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Executar Pipeline de Treinamento Diário
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x deploy/train-local-ai.sh
          ./deploy/train-local-ai.sh
