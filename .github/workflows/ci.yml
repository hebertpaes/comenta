name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancela execuções antigas do mesmo ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: monorepo (build de todos os workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # Um lockfile só na raiz: `npm ci` instala todos os workspaces de uma vez.
      - run: npm ci
      # @comenta/shared precisa dos .d.ts gerados antes de api e web compilarem.
      - run: npm run build -w @comenta/shared
      - run: npm run build --workspaces --if-present
