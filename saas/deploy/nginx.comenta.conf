# Nginx — proxy reverso para o Comenta SaaS em comenta.com.br
# Coloque em /etc/nginx/sites-available/ e gere o SSL com:
#   sudo certbot --nginx -d app.comenta.com.br -d api.comenta.com.br
# (o certbot preenche os blocos listen 443 / ssl_certificate)

# API — api.comenta.com.br
server {
    server_name api.comenta.com.br;
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Painel — app.comenta.com.br (build estático do saas/web)
server {
    server_name app.comenta.com.br;
    listen 80;

    root /var/www/comenta-app;   # dist do painel React
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
