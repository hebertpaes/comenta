<!--
  Variante "maskable": o Android (e o Chrome no Linux) recorta o ícone em
  círculo, losango ou squircle conforme o aparelho. Só os 80% centrais são
  garantidos, então aqui o fundo é sangrado até a borda e o balão fica menor
  que em icone.svg — no ícone normal ele encostaria no corte.
-->
