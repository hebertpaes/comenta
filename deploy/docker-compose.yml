# =============================================================
# Deploy unificado — TODO o Comenta em um único VPS (monorepo)
# =============================================================
# Sobe: site (comenta.com.br) + API (api.comenta.com.br) + painel
# (app.comenta.com.br) + Postgres + Redis. Tudo a partir deste repositório.
#
# Rode a partir de deploy/ (na raiz do repo comenta):
#   cp .env.example .env   # e preencha os segredos
#   # build do painel (Vite) uma vez:
#   (cd ../saas/web && npm ci && VITE_API_URL=https://api.comenta.com.br npm run build)
#   docker compose --env-file .env up -d --build
#
# As portas ficam expostas só em 127.0.0.1 — o Nginx do host (com TLS)
# publica os domínios. Veja nginx/comenta.conf e o RUNBOOK.md.

name: comenta

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: comenta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: comenta_saas
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comenta"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    volumes:
      - redis_data:/data

  # API do SaaS (saas/api) — porta 4000
  api:
    build:
      context: ../saas/api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: https://app.comenta.com.br
      API_URL: https://api.comenta.com.br
      DATABASE_URL: postgresql://comenta:${DB_PASSWORD}@postgres:5432/comenta_saas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
      CORS_ORIGINS: https://app.comenta.com.br
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_CLASSIFY: ${AI_MODEL_CLASSIFY:-claude-haiku-4-5}
      AI_MODEL_SUMMARIZE: ${AI_MODEL_SUMMARIZE:-claude-haiku-4-5}
      AI_MODEL_SUGGEST: ${AI_MODEL_SUGGEST:-claude-sonnet-5}
    command: sh -c "npx drizzle-kit push --force && npx tsx src/db/seed.ts && npx tsx src/index.ts"
    ports:
      - "127.0.0.1:4000:4000"

  # Site institucional / landing + chat (site/) — porta 3000
  site:
    build:
      context: ../site
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_NEWS_SOURCE: ${NEXT_PUBLIC_NEWS_SOURCE:-https://hojemt.com.br}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-5566999999999}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"

  # Painel React do SaaS (build estático de saas/web) — porta 8080
  panel:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../saas/web/dist:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8080:80"

  # Banco do Ghost (Ghost 5 exige MySQL 8)
  ghost-db:
    image: mysql:8
    restart: always
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_PASSWORD:?defina GHOST_DB_PASSWORD no .env}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
    volumes:
      - ghost_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${GHOST_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ghost (CMS/blog) — blog.comenta.com.br — porta 2368
  ghost:
    image: ghost:5-alpine
    restart: always
    depends_on:
      ghost-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      url: ${GHOST_URL:-https://blog.comenta.com.br}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ghost
    volumes:
      - ghost_content:/var/lib/ghost/content
    ports:
      - "127.0.0.1:2368:2368"

volumes:
  pg_data:
  redis_data:
  ghost_db:
  ghost_content:
