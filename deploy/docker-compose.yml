# =============================================================
# Deploy unificado — TODO o Comenta em um único VPS (monorepo)
# =============================================================
# Sobe: site (comenta.com.br) + API (api.comenta.com.br) + painel
# (app.comenta.com.br) + Postgres + Redis. Tudo a partir deste repositório.
#
# Rode a partir de deploy/ (na raiz do repo comenta):
#   cp .env.example .env   # e preencha os segredos
#   # build do painel (Vite) uma vez:
#   (cd ../saas/web && npm ci && VITE_API_URL=https://api.comenta.com.br npm run build)
#   docker compose --env-file .env up -d --build
#
# As portas ficam expostas só em 127.0.0.1 — o Nginx do host (com TLS)
# publica os domínios. Veja nginx/comenta.conf e o RUNBOOK.md.

name: comenta

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: comenta
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: comenta_saas
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comenta"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}"]
    volumes:
      - redis_data:/data

  # API do SaaS (saas/api) — porta 4000
  api:
    build:
      context: ..
      dockerfile: saas/api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: https://app.comenta.com.br
      API_URL: https://api.comenta.com.br
      DATABASE_URL: postgresql://comenta:${DB_PASSWORD}@postgres:5432/comenta_saas
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env}
      CORS_ORIGINS: https://app.comenta.com.br,https://comenta.com.br,https://www.comenta.com.br
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL_CLASSIFY: ${AI_MODEL_CLASSIFY:-claude-haiku-4-5}
      AI_MODEL_SUMMARIZE: ${AI_MODEL_SUMMARIZE:-claude-haiku-4-5}
      AI_MODEL_SUGGEST: ${AI_MODEL_SUGGEST:-claude-sonnet-5}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-claude-sonnet-5}
      # WhatsApp (Baileys): 'baileys' usa a conexão real; 'demo' simula o
      # pareamento. As credenciais pareadas ficam no volume wa_data.
      WHATSAPP_MODE: ${WHATSAPP_MODE:-baileys}
      WHATSAPP_DATA_DIR: /data/wa
    command: sh -c "npx drizzle-kit push --force && npx tsx src/db/seed.ts && npx tsx src/index.ts"
    volumes:
      - wa_data:/data/wa
    ports:
      - "127.0.0.1:4000:4000"

  # Site institucional / landing + chat (site/) — porta 3000
  site:
    build:
      context: ..
      dockerfile: site/Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_NEWS_SOURCE: ${NEXT_PUBLIC_NEWS_SOURCE:-https://hojemt.com.br}
      NEXT_PUBLIC_WHATSAPP: ${NEXT_PUBLIC_WHATSAPP:-5566999999999}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:3000:3000"

  # Painel React do SaaS (build estático de saas/web) — porta 8080
  panel:
    image: nginx:1.27-alpine
    restart: always
    volumes:
      - ../saas/web/dist:/usr/share/nginx/html:ro
      # Fallback de SPA: sem isto, abrir /conversas/:id direto dá 404.
      - ./nginx/panel.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

  # Banco do Ghost (Ghost 5 exige MySQL 8). Fixado em 8.0: o 8.4 removeu
  # a flag --default-authentication-plugin e aborta o boot.
  ghost-db:
    image: mysql:8.0
    restart: always
    # Flags enxutas para caber em VMs pequenas (buffer pool reduzido,
    # performance_schema desligado) e auth compatível com Ghost 5.
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--innodb-buffer-pool-size=128M"
      - "--performance-schema=OFF"
      - "--skip-log-bin"
      - "--max-connections=50"
    environment:
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_PASSWORD:?defina GHOST_DB_PASSWORD no .env}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
    volumes:
      - ghost_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${GHOST_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Primeira inicialização do MySQL 8 (criação do datadir) pode
      # demorar bastante em VM pequena — não conte esse tempo como falha.
      start_period: 120s

  # Ghost (CMS/blog) — blog.comenta.com.br — porta 2368
  ghost:
    image: ghost:5-alpine
    restart: always
    depends_on:
      ghost-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      url: ${GHOST_URL:-https://blog.comenta.com.br}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ghost
    volumes:
      - ghost_content:/var/lib/ghost/content
    ports:
      - "127.0.0.1:2368:2368"

  # Robô de conteúdo do blog (curadoria de fontes reais → Ghost).
  # NÃO sobe por padrão (profile "bot"). Rodar sob demanda:
  #   docker compose --profile bot run --rm blog-bot          # 1 rodada
  # ou em loop, definindo BLOG_INTERVAL_MIN no .env:
  #   docker compose --profile bot up -d blog-bot
  # Precisa de GHOST_ADMIN_API_KEY (Ghost → Integrations → Custom).
  blog-bot:
    build:
      context: ..
      dockerfile: content/Dockerfile
    profiles: ["bot"]
    restart: "no"
    depends_on:
      - ghost
    environment:
      GHOST_ADMIN_URL: http://ghost:2368
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BLOG_AUTOPUBLISH: ${BLOG_AUTOPUBLISH:-0}
      BLOG_INTERVAL_MIN: ${BLOG_INTERVAL_MIN:-0}
      BLOG_PER_FEED: ${BLOG_PER_FEED:-3}

  # =============================================================
  # Catálogo de ferramentas open-source (produto/serviço/treinamento).
  # NÃO sobem por padrão (profile "tools"): cada uma é auto-contida e
  # opcional. Suba as que quiser sob demanda:
  #   docker compose --profile tools up -d n8n metabase nocodb
  # e desligue com:
  #   docker compose --profile tools down
  # No painel, a aba "🧩 Ferramentas" descreve cada uma e abre o link.
  # =============================================================

  # n8n — automação de fluxos (webhooks + centenas de integrações).
  # Casa com os webhooks do Comenta (evento conversation.created etc.).
  n8n:
    image: n8nio/n8n:latest
    profiles: ["tools"]
    restart: always
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-America/Cuiaba}
      # cookie seguro só faz sentido atrás de HTTPS; local usa http.
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  # Metabase — BI / relatórios e dashboards sobre os dados da empresa.
  # (Site na 3000, então Metabase publica em 3001.)
  metabase:
    image: metabase/metabase:latest
    profiles: ["tools"]
    restart: always
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:3001:3000"

  # NocoDB — banco de dados no-code (tipo Airtable) para planilhas,
  # CRMs simples e catálogos que a equipe monta sozinha.
  nocodb:
    image: nocodb/nocodb:latest
    profiles: ["tools"]
    restart: always
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  pg_data:
  redis_data:
  ghost_db:
  ghost_content:
  wa_data:
  n8n_data:
  metabase_data:
  nocodb_data:
