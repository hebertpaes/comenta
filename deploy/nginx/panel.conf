# Nginx do container que serve o painel (build estático do Vite).
#
# O painel virou uma SPA com rotas de verdade (/conversas/:id, /cursos/:id…).
# Esses caminhos não existem como arquivo em disco: quem resolve é o roteador,
# no navegador. Sem o try_files abaixo, abrir um link direto ou dar F5 em
# qualquer tela que não seja a raiz devolveria 404 — a configuração padrão da
# imagem nginx procuraria /usr/share/nginx/html/conversas/abc e desistiria.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Os assets levam hash no nome, então podem ser cacheados para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Qualquer outra rota cai no index.html e o React Router assume dali.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index nunca pode ser cacheado: é ele que aponta para o bundle novo
    # depois de cada deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Mesma regra para o service worker do app instalado: é a checagem dele que
    # detecta uma versão nova. Cacheado, o painel instalado ficaria preso à
    # versão do dia da instalação — e sem barra de endereços para forçar F5.
    location = /sw.js {
        add_header Cache-Control "no-store, must-revalidate";
        types { } default_type application/javascript;
    }

    # O manifesto muda pouco, mas quando muda (nome, ícone, atalhos) o app
    # instalado precisa ver: uma hora, não um ano.
    location = /manifest.webmanifest {
        expires 1h;
        types { } default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
