# Cabeçalhos de segurança para os vhosts atrás do Nginx (Ghost do HOJE MT e
# painéis). Uso, dentro do `location /` que faz proxy_pass:
#     include /etc/nginx/snippets/seguranca-cabecalhos.conf;
# (copie este arquivo para /etc/nginx/snippets/ e rode `nginx -t` antes do reload).
# Atenção: um add_header dentro do location anula os do nível server — por isso
# o include vai no location. Sem CSP completa: o tema e os embeds do Ghost
# quebrariam; o frame-ancestors fica por conta do X-Frame-Options.
proxy_hide_header X-Powered-By;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
