# =============================================================
# Nginx (host) — referência do proxy reverso do sistema completo
# =============================================================
# ATENÇÃO: este arquivo é só referência. Quem grava o vhost de verdade é o
# deploy/bootstrap.sh, em /etc/nginx/sites-available/comenta.conf, e ele
# reescreve o arquivo inteiro a cada execução — já com o bloco 443 de cada
# domínio que tenha certificado, e trocando intsoft.com.br pelo DOMAIN que
# recebeu. Editar à mão não adianta: a próxima execução sobrescreve.
#
# Está aqui para mostrar o desenho: um bloco por domínio, cada um apontando
# para um serviço que escuta só em 127.0.0.1 (ver docker-compose.yml).
#
#   intsoft.com.br  www.intsoft.com.br  ->  127.0.0.1:3000   site (Next)
#   app.intsoft.com.br                  ->  127.0.0.1:8080   painel (React)
#   api.intsoft.com.br                  ->  127.0.0.1:4000   API (+ WebSocket)
#   blog.intsoft.com.br                 ->  127.0.0.1:2368   Ghost

# Site / landing + chat (o próprio Next envia os headers de segurança/CSP)
server {
    listen 80;
    listen [::]:80;
    server_name intsoft.com.br www.intsoft.com.br;
    server_tokens off;
    client_max_body_size 20m;

    # Fica fora de qualquer redirecionamento: é por aqui que o Let's Encrypt
    # renova os certificados sem parar o serviço.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Painel (build estático do saas/web servido por um nginx em container)
server {
    listen 80;
    listen [::]:80;
    server_name app.intsoft.com.br;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API — inclui WebSocket / Socket.IO
server {
    listen 80;
    listen [::]:80;
    server_name api.intsoft.com.br;
    server_tokens off;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

# Blog (Ghost) — o do compose, ou o nativo do servidor: os dois na 2368
server {
    listen 80;
    listen [::]:80;
    server_name blog.intsoft.com.br;
    server_tokens off;
    client_max_body_size 50m;   # uploads de imagens no Ghost

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
